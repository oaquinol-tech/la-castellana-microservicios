trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: |
    echo "Iniciando fase de Build (Compilación)..."
    echo "Preparando contenedores Docker..."
  displayName: 'Fase de Build'

- script: |
    echo "Ejecutando Test iniciales (Unit Tests)..."
    echo "Validando conexión a base de datos..."
  displayName: 'Fase de Test'
